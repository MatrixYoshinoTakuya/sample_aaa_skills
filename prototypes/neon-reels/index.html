<html lang="ja">
<head>

<title>Neon Reels</title>
<style>

<body>
<canvas id="game"></canvas>
<script src="config.js"></script>
<script>
'use strict';
// Neon Reels: a three-reel, five-line slot machine. Built on the one-shot's starter: the fixed
// step, the clock hook, window.game and the play and figures scenes are the starter's.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size
const PIXEL = false;
const FONT = "'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif";
const TITLE = 'NEON REELS';
const CONTROLS = ['スペース / SPINボタン: スピン', '↑ ↓ / ＋ −ボタン: ベット変更', 'R: やり直し　M: 音のオン・オフ'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
let vseed = 97531;
function vrng() { // looks only (lights, coin sparks): never decides a spin
  vseed = (vseed + 0x6D2B79F5) | 0;
  let t = Math.imul(vseed ^ (vseed >>> 15), vseed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- What is kept between sessions: the best coin count and how many runs were started ----
const store = {
  get(k, d) { try { const v = Number(localStorage.getItem('neon-reels.' + k)); return v > 0 ? v : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('neon-reels.' + k, String(v)); } catch (e) { /* private mode: nothing kept */ } },
};

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d'); // swapped only while the symbols are baked
function fit() { // fills the window at any size and pixel ratio
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = !PIXEL;
}
addEventListener('resize', fit); fit();
function text(s, x, y, size, c, align = 'center', glow = null, weight = 600) {
  ctx.save();
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = size * 0.5; }
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
  ctx.restore();
}
function rr(x, y, w, h, r) { // a rounded box path
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---- Palette: the brief's roles ---------------------------------------------------------
const COL = {
  bg0: '#03040c', bg1: '#0a1030', cyan: '#3fe9ff', magenta: '#ff3fd0', gold: '#ffc84a',
  goldDark: '#8a5a12', red: '#ff3b4e', ink: '#05060f', white: '#f4f8ff', dim: '#aab6d8',
  panel: '#0b1130', green: '#58f08a',
};
const LINE_COL = ['#3fe9ff', '#ffc84a', '#ff3fd0', '#58f08a', '#ff9a3f'];

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
let click = null; // a pointer press, in logical pixels, read by the next step
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', e => {
  startAudio();
  const b = canvas.getBoundingClientRect();
  click = { x: (e.clientX - b.left) * W / b.width, y: (e.clientY - b.top) * H / b.height };
});
addEventListener('blur', () => down.clear());
const inBox = (p, b) => p && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
function sfx(delay, freq, dur, type, vol) { state.sounds.push({ at: state.t + delay, freq, dur, type, vol }); }
function jingle(notes, gap, type = 'triangle', vol = 0.22) { notes.forEach((f, i) => sfx(i * gap, f, gap * 2.2, type, vol)); }

// ---- The symbols: every one drawn, each with its own outline ----------------------------
// Drawn once into its own picture (with its glow), then stamped: 50 units is half a cell.
function path(pts) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); }
function inked(fill, glow, lw = 4) { // fill with a glow, then a dark outline
  ctx.save(); ctx.shadowColor = glow; ctx.shadowBlur = 16; ctx.fillStyle = fill; ctx.fill(); ctx.restore();
  ctx.lineWidth = lw; ctx.strokeStyle = COL.ink; ctx.lineJoin = 'round'; ctx.stroke();
}
function grad(x0, y0, x1, y1, a, b) { const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
const SYMBOLS = {
  C: { name: 'チェリー', pay: 'pay_cherry', draw() {
    ctx.lineCap = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = '#2f9d55';
    ctx.beginPath(); ctx.moveTo(-17, 6); ctx.quadraticCurveTo(-12, -22, 6, -36); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(19, 10); ctx.quadraticCurveTo(18, -18, 6, -36); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(20, -33, 15, 7, -0.35, 0, 7); inked('#58f08a', '#58f08a', 3);
    for (const [x, y] of [[-18, 16], [20, 22]]) {
      ctx.beginPath(); ctx.arc(x, y, 18, 0, 7); inked(grad(x - 10, y - 14, x + 10, y + 16, '#ff7a86', '#d5142c'), COL.red);
      ctx.beginPath(); ctx.ellipse(x - 6, y - 7, 5, 3, -0.7, 0, 7); ctx.fillStyle = '#ffd9dd'; ctx.fill();
    }
  } },
  L: { name: 'レモン', pay: 'pay_lemon', draw() {
    ctx.save(); ctx.rotate(-0.4);
    ctx.beginPath(); ctx.moveTo(-38, 0); ctx.quadraticCurveTo(-30, -4, -26, -14);
    ctx.bezierCurveTo(-12, -30, 12, -30, 26, -14); ctx.quadraticCurveTo(30, -4, 38, 0);
    ctx.quadraticCurveTo(30, 4, 26, 14); ctx.bezierCurveTo(12, 30, -12, 30, -26, 14);
    ctx.quadraticCurveTo(-30, 4, -38, 0); ctx.closePath();
    inked(grad(0, -24, 0, 24, '#fff27a', '#f0b414'), '#ffe24a');
    ctx.beginPath(); ctx.ellipse(-6, -10, 12, 4, 0, 0, 7); ctx.fillStyle = '#fffbd0'; ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.ellipse(24, -30, 12, 6, 0.5, 0, 7); inked('#58f08a', '#58f08a', 3);
  } },
  B: { name: 'ベル', pay: 'pay_bell', draw() {
    ctx.beginPath(); ctx.arc(0, 33, 8, 0, 7); inked('#ffe9a8', COL.gold, 3);
    ctx.beginPath(); ctx.moveTo(0, -32); ctx.bezierCurveTo(22, -32, 22, -2, 26, 12); ctx.lineTo(36, 20); ctx.lineTo(36, 28);
    ctx.lineTo(-36, 28); ctx.lineTo(-36, 20); ctx.lineTo(-26, 12); ctx.bezierCurveTo(-22, -2, -22, -32, 0, -32); ctx.closePath();
    inked(grad(-20, -30, 20, 28, '#fff0a0', '#e89a12'), COL.gold);
    ctx.beginPath(); ctx.arc(0, -35, 6, 0, 7); inked('#fff0a0', COL.gold, 3);
    ctx.beginPath(); ctx.moveTo(-10, -18); ctx.quadraticCurveTo(-16, -4, -17, 10); ctx.lineWidth = 4; ctx.strokeStyle = '#fffbe0'; ctx.lineCap = 'round'; ctx.stroke();
  } },
  R: { name: 'バー', pay: 'pay_bar', draw() {
    rr(-40, -36, 80, 72, 10); inked('#101a4a', COL.cyan);
    for (const y of [-27, -8, 11]) { rr(-32, y, 64, 15, 5); inked(grad(0, y, 0, y + 15, '#f4f8ff', '#3fe9ff'), COL.cyan, 2.5); }
  } },
  D: { name: 'ダイヤ', pay: 'pay_diamond', draw() {
    path([[-22, -30], [22, -30], [38, -8], [0, 38], [-38, -8]]); inked(grad(-30, -30, 30, 36, '#c8fbff', '#1c9bd8'), COL.cyan);
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#eaffff'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-38, -8); ctx.lineTo(38, -8); ctx.moveTo(-22, -30); ctx.lineTo(-12, -8); ctx.lineTo(0, 38);
    ctx.lineTo(12, -8); ctx.lineTo(22, -30); ctx.moveTo(-12, -8); ctx.lineTo(0, -30); ctx.lineTo(12, -8); ctx.stroke();
  } },
  S: { name: 'セブン', pay: 'pay_seven', draw() {
    path([[-30, -36], [32, -36], [32, -18], [6, 38], [-18, 38], [8, -14], [-14, -14], [-14, -6], [-30, -6]]);
    inked(grad(-20, -36, 20, 38, '#ff8a94', '#e0102c'), COL.red, 5);
    ctx.lineWidth = 3; ctx.strokeStyle = '#ffe4e6'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-23, -29); ctx.lineTo(24, -29); ctx.stroke();
  } },
  W: { name: 'ワイルド', pay: 'pay_wild', draw() {
    const star = (R, r) => { const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r : R; p.push([Math.cos(a) * q, Math.sin(a) * q + 2]); } path(p); };
    star(40, 18); inked(grad(-30, -36, 30, 36, '#ff9ae6', '#c81aa0'), COL.magenta);
    star(20, 9); ctx.fillStyle = '#fff0fb'; ctx.fill();
  } },
  X: { name: 'クラウン', pay: null, draw() {
    path([[-34, 14], [-40, -22], [-19, -2], [0, -34], [19, -2], [40, -22], [34, 14]]); inked(grad(0, -34, 0, 14, '#fff0a0', '#f0a818'), COL.magenta);
    rr(-34, 14, 68, 18, 5); inked(grad(0, 14, 0, 32, '#ffd86a', '#c87a10'), COL.magenta);
    for (const [x, y, r] of [[-40, -24, 6], [0, -36, 7], [40, -24, 6], [-18, 23, 5], [0, 23, 5], [18, 23, 5]]) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); inked('#ff6fe0', COL.magenta, 2.5);
    }
  } },
};
const ORDER = ['S', 'W', 'D', 'R', 'B', 'L', 'C', 'X'];
const stamps = {};
(function bake() {
  const main = ctx;
  for (const id of ORDER) {
    const c = document.createElement('canvas'); c.width = c.height = 280; // 140 units, twice over for sharpness
    ctx = c.getContext('2d'); ctx.setTransform(2, 0, 0, 2, 140, 140);
    SYMBOLS[id].draw(); stamps[id] = c;
  }
  ctx = main;
})();
function symbol(id, x, y, half) { // half: half the symbol's size in logical pixels
  const s = half * 1.4; ctx.drawImage(stamps[id], x - s, y - s, s * 2, s * 2);
}

// ---- The machine: strips, lines and what a stop pays ------------------------------------
const STRIPS = CONFIG.strips.map(s => s.split(''));
const LINES = [[0, 0, 0], [1, 1, 1], [2, 2, 2], [0, 1, 2], [2, 1, 0]]; // the row on each reel
const MIN_BET = CONFIG.bet_levels[0] * LINES.length;
const mod = (a, n) => ((a % n) + n) % n;
function gridAt(stops) { return stops.map((s, r) => [0, 1, 2].map(d => STRIPS[r][mod(s + d, STRIPS[r].length)])); }
function linePay(a, b, c) { // in line bets; the wild stands for anything but the crown
  const pair = a === 'C' && b === 'C' ? { sym: 'C', n: 2, pay: tune.pay_cherry_pair } : null;
  if (a === 'X' || b === 'X' || c === 'X') return pair;
  const t = [a, b, c].find(s => s !== 'W') || 'W';
  if ([a, b, c].every(s => s === t || s === 'W')) return { sym: t, n: 3, pay: tune[SYMBOLS[t].pay] };
  return pair;
}
function evaluate(grid) {
  const wins = [];
  LINES.forEach((l, i) => { const p = linePay(grid[0][l[0]], grid[1][l[1]], grid[2][l[2]]); if (p && p.pay > 0) wins.push({ line: i, ...p }); });
  return { wins, crowns: grid.every(col => col.includes('X')) };
}
function findStops(want) { // the first stop that shows what the first minute teaches
  for (let i = 0; i < STRIPS[0].length; i++) for (let j = 0; j < STRIPS[1].length; j++) for (let k = 0; k < STRIPS[2].length; k++) {
    const r = evaluate(gridAt([i, j, k])); if (want(r)) return [i, j, k];
  }
  return null;
}
const GUIDE_CHERRY = findStops(r => !r.crowns && r.wins.length === 1 && r.wins[0].line === 1 && r.wins[0].sym === 'C' && r.wins[0].n === 3);
const GUIDE_CROWNS = findStops(r => r.crowns && r.wins.length === 0);

// ---- Layout ---------------------------------------------------------------------------
const RX = 150, RY = 152, CW = 170, CH = 128, RW = CW * 3, RH = CH * 3; // the reel window
const CAB = { x: 70, y: 104, w: 680, h: 596 };
const BTN = {
  spin: { x: 566, y: 574, w: 168, h: 108 }, minus: { x: 322, y: 612, w: 52, h: 52 }, plus: { x: 492, y: 612, w: 52, h: 52 },
  mute: { x: 1194, y: 26, w: 56, h: 56 },
};
const cellX = r => RX + CW * (r + 0.5), cellY = row => RY + CH * (row + 0.5);
const lights = []; for (let i = 0; i < 46; i++) lights.push({ x: vrng() * W, y: vrng() * H, r: 10 + vrng() * 46, c: [COL.cyan, COL.magenta, COL.gold][i % 3], p: vrng() * 6 });

// ---- Scenes ---------------------------------------------------------------------------
let scene, state;
function reset() {
  const runs = store.get('runs', 0);
  seed = ((Number(params.get('seed')) || CONFIG.seed) + runs * 7919) | 0;
  const best = Math.max(store.get('best', 0), tune.start_coins);
  state = {
    t: 0, steps: 0, score: tune.start_coins, gained: '',
    coins: tune.start_coins, shown: tune.start_coins, bet: 0, best, bestBefore: best, peak: tune.start_coins,
    spins: 0, free: 0, inFree: false, freeWin: 0, lastWin: 0, wins: [], triggered: false, newRecord: false,
    phase: 'idle', phaseT: 0, showFor: 0, guided: runs <= 1,
    reels: STRIPS.map((s, i) => ({ pos: [3, 9, 15][i], prev: [3, 9, 15][i], target: [3, 9, 15][i], stopAt: 0, stopped: true })),
    grid: gridAt([3, 9, 15]), banner: null, coinsFx: [], sounds: [], signFlash: 0,
  };
}
function newRun() { store.set('runs', store.get('runs', 0) + 1); reset(); scene = 'play'; }
const lineBet = () => CONFIG.bet_levels[state.bet];
const totalBet = () => lineBet() * LINES.length;
function setBet(i) {
  i = Math.max(0, Math.min(CONFIG.bet_levels.length - 1, i));
  while (i > 0 && CONFIG.bet_levels[i] * LINES.length > state.coins) i--; // never more than the coins held
  if (i !== state.bet) { state.bet = i; tone(300 + i * 90, 0.07, 'square', 0.15); }
}
function banner(kind, big, small, dur) { state.banner = { kind, big, small, t: 0, dur }; }

function startSpin() {
  const s = state;
  if (s.free > 0) s.free--;
  else {
    setBet(s.bet);
    if (s.coins < totalBet()) return;
    s.coins -= totalBet();
  }
  s.shown = s.coins; s.spins++; s.wins = []; s.lastWin = 0; s.triggered = false; s.banner = null;
  seed = (seed ^ Math.imul(s.steps, 0x9E3779B1)) | 0; // when the player pulls stirs the reels; a replay pulls on the same steps
  let stops = STRIPS.map(st => Math.floor(rng() * st.length));
  if (s.guided && !s.inFree) {
    if (s.spins === tune.guide_small_win_spin && GUIDE_CHERRY) stops = GUIDE_CHERRY;
    if (s.spins === tune.guide_free_spin && GUIDE_CROWNS) stops = GUIDE_CROWNS;
  }
  s.reels.forEach((r, i) => { r.target = stops[i]; r.stopped = false; r.stopAt = tune.first_stop + i * tune.stop_gap; });
  s.phase = 'spin'; s.phaseT = 0;
  tone(140, 0.18, 'sawtooth', 0.12); sfx(0.06, 210, 0.16, 'sawtooth', 0.1);
  events.push({ t: s.t, type: 'spin', bet: totalBet(), free: s.inFree });
}
const backOut = p => { const c = 1.9, q = p - 1; return 1 + (c + 1) * q * q * q + c * q * q; };
function updateSpin(dt) {
  const s = state;
  if ((pressed('Space') || pressed('Enter') || inBox(click, BTN.spin)) && s.phaseT > 0.15) // a second press stops the reels early
    s.reels.forEach((r, i) => { if (!r.stopped) r.stopAt = Math.min(r.stopAt, s.phaseT + i * 0.09); });
  let all = true;
  s.reels.forEach((r, i) => {
    r.prev = r.pos;
    if (r.stopped) return;
    const n = STRIPS[i].length;
    if (s.phaseT < r.stopAt) { r.pos = mod(r.pos - tune.reel_speed * dt, n); all = false; return; }
    const p = Math.min(1, (s.phaseT - r.stopAt) / tune.settle_time);
    r.pos = r.target + 2.6 * (1 - backOut(p));
    if (r.prev < r.pos - 1 || r.prev > r.pos + 4) r.prev = r.pos + tune.reel_speed * dt; // the jump into the landing is not drawn as a sweep
    if (p >= 1) { r.pos = r.prev = r.target; r.stopped = true; tone(170 - i * 18, 0.09, 'square', 0.2); } else all = false;
  });
  if (all) resolve();
}
function resolve() {
  const s = state;
  s.grid = gridAt(s.reels.map(r => r.target));
  const res = evaluate(s.grid), mult = s.inFree ? tune.free_multiplier : 1;
  s.wins = res.wins.map(w => ({ ...w, amount: w.pay * lineBet() * mult }));
  const total = s.wins.reduce((a, w) => a + w.amount, 0);
  s.lastWin = total; s.coins += total; s.score = s.coins;
  if (s.inFree) s.freeWin += total;
  const ratio = total / totalBet();
  s.showFor = total > 0 ? Math.min(3.2, tune.win_show_time + ratio * 0.12) : 0.22;
  if (total > 0) {
    s.signFlash = ratio >= 10 ? 2.6 : 1.2;
    if (ratio >= 10) jingle([523, 659, 784, 1047, 784, 1047, 1319], 0.1); else if (ratio >= 3) jingle([523, 659, 784, 1047], 0.09); else jingle([659, 880], 0.08);
    const n = Math.min(36, 4 + Math.floor(ratio * 3));
    for (let i = 0; i < n; i++) s.coinsFx.push({ x: RX + vrng() * RW, y: RY + RH * (0.2 + vrng() * 0.6), vx: (vrng() - 0.5) * 260, vy: -220 - vrng() * 260, t: -i * 0.035, spin: vrng() * 6 });
  }
  if (res.crowns) {
    s.triggered = true; s.free += tune.free_spins;
    if (!s.inFree) { s.inFree = true; s.freeWin = 0; }
    banner('free', `フリースピン ${tune.free_spins}回`, `配当 ${tune.free_multiplier}倍`, 1.8); s.showFor += 1.8; s.signFlash = 2.6;
    jingle([392, 523, 659, 784, 1047, 1319], 0.11, 'square', 0.16);
  }
  if (s.coins > s.peak) s.peak = s.coins;
  if (s.coins > s.best) {
    s.best = s.coins; store.set('best', s.best);
    if (!s.newRecord && s.best > s.bestBefore) { s.newRecord = true; if (!res.crowns) banner('record', '最高記録 更新', `${s.best} コイン`, 1.6); }
  }
  s.gained = `最高 ${s.peak} コイン`;
  s.phase = 'show'; s.phaseT = 0;
  events.push({ t: s.t, type: 'stop', win: total, coins: s.coins, free: s.free });
}
function updateShow() {
  const s = state, wantSpin = pressed('Space') || pressed('Enter') || inBox(click, BTN.spin);
  if (s.free > 0) { // free spins play themselves; a press hurries them
    if (s.phaseT >= s.showFor + tune.free_spin_pause || (wantSpin && s.phaseT > 0.2 && !s.triggered)) startSpin();

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear(); click = null;
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();

}

function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it

    if (draw) { ALPHA = alpha; drawFrame(); }
  },
